<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lidl PLU Gyakorló</title>
    
    <style>
        :root {
            --bg: #1e1e2e; --panel: #2a2a3e; --surface: #181825;
            --text: #cdd6f4; --subtext: #a6adc8;
            --bg-left: #ffffff; --bg-right: #f0f2f5;
            --btn-num: #7abce8; --btn-plu: #96b986; --btn-white: #ffffff;
            --streak-bg: #4a4a4a; --streak-ok: #4caf50; --streak-err: #f44336;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Helvetica', Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100dvh; width: 100vw; overflow: hidden; }

        #menu-screen, #mode-screen { text-align: center; width: 100%; max-width: 600px; padding: 20px; }
        #mode-screen { display: none; }
        h1 { font-size: clamp(2rem, 5vw, 2.5rem); margin-bottom: 10px; }
        .cat-btn, .mode-btn { background-color: var(--panel); color: var(--text); border: none; width: 100%; padding: 20px; font-size: 1.3rem; font-weight: bold; border-radius: 12px; margin-bottom: 15px; cursor: pointer; }
        
        #app-screen { display: none; width: 100%; max-width: 1400px; height: 100%; background-color: var(--bg-left); flex-direction: column; }
        .top-bar { background: black; height: 6dvh; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; color: white; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .left-pane { flex: 1.3; display: flex; flex-direction: column; position: relative; }
        .product-name { flex: 1; display: flex; justify-content: center; align-items: center; font-size: clamp(2rem, 7dvh, 5rem); font-weight: bold; color: #333; text-align: center; padding: 2vmin; }
        .plu-bar { background: black; height: 16dvh; display: flex; justify-content: center; align-items: center; font-size: clamp(3rem, 10dvh, 6rem); font-weight: bold; color: white; }
        
        .right-pane { flex: 1; background: var(--bg-right); display: flex; flex-direction: column; padding: 2vmin; border-left: 2px solid #ddd; }
        .input-display { flex: 1; background: white; height: 10dvh; display: flex; align-items: center; justify-content: flex-end; padding: 0 15px; font-size: clamp(2rem, 5dvh, 3.5rem); font-weight: bold; color: #333; border: 2px solid #ddd; margin-right: 1.5vmin; }
        
        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 1.5vmin; flex: 1; }
        .btn { border: none; border-radius: 8px; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: clamp(1.2rem, 4dvh, 2.5rem); cursor: pointer; color: #333; }
        .btn-num { background: var(--btn-num); }
        .btn-plu { background: var(--btn-plu); grid-row: span 2; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>Lidl PLU Gyakorló</h1>
        <div id="categories"></div>
    </div>

    <div id="mode-screen">
        <h1>Mód választása</h1>
        <button class="mode-btn" onclick="startGame('tanulo')">📖 Tanuló mód (3x kell)</button>
        <button class="mode-btn" onclick="startGame('gyakorlo')">🎯 Gyakorló mód (1x kell)</button>
        <button class="cat-btn" style="background:transparent; text-decoration:underline;" onclick="showMenu()">Vissza</button>
    </div>

    <div id="app-screen">
        <div class="top-bar">
            <div id="counter-display">0 / 0</div>
            <button onclick="showModeScreen()" style="background:none; border:none; color:white; font-weight:bold;">← Vissza</button>
        </div>
        <div class="main-container">
            <div class="left-pane">
                <div class="product-name" id="product-name">Termék</div>
                <div class="plu-bar" id="plu-hint"></div>
            </div>
            <div class="right-pane">
                <div style="display:flex; margin-bottom:15px;">
                    <div class="input-display" id="input-display"></div>
                    <button class="c-btn" style="width:75px; height:75px; font-size:2rem;" onclick="pressC()">C</button>
                </div>
                <div class="numpad">
                    <button class="btn" onclick="pressNum('7')">7</button>
                    <button class="btn" onclick="pressNum('8')">8</button>
                    <button class="btn" onclick="pressNum('9')">9</button>
                    <button class="btn btn-plu" onclick="pressPlu()">PLU</button>
                    <button class="btn" onclick="pressNum('4')">4</button>
                    <button class="btn" onclick="pressNum('5')">5</button>
                    <button class="btn" onclick="pressNum('6')">6</button>
                    <button class="btn" onclick="pressNum('1')">1</button>
                    <button class="btn" onclick="pressNum('2')">2</button>
                    <button class="btn" onclick="pressNum('3')">3</button>
                    <button class="btn" style="background:#ff9999;" onclick="revealCode()">❓</button>
                    <button class="btn" onclick="pressNum('0')">0</button>
                    <button class="btn" onclick="pressNum('00')">00</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const adatbazis = [
            { code: 1, name: "Banán" }, { code: 4, name: "Bandázsolt banán" }, { code: 5, name: "Citrom" },
            { code: 6, name: "Lime citrom" }, { code: 7, name: "Nagyméretű citrom" }, { code: 10, name: "Piros grapefruit" },
            { code: 12, name: "Mandarin" }, { code: 20, name: "Narancs" }, { code: 21, name: "Nagyméretű narancs" },
            { code: 30, name: "Pomelo" }, { code: 31, name: "Piros pomelo" }, { code: 33, name: "Ananász" },
            { code: 34, name: "Avokádó" }, { code: 35, name: "Friss füge" }, { code: 37, name: "Datolyaszilva" },
            { code: 40, name: "Kivi" }, { code: 41, name: "Kiwi Gold" }, { code: 42, name: "Kókuszdió" },
            { code: 45, name: "Licsi" }, { code: 46, name: "Mangó" }, { code: 49, name: "Papaja" },
            { code: 52, name: "Fairtrade Maracuja" }, { code: 54, name: "Gyömbér" }, { code: 61, name: "Cseresznye" },
            { code: 62, name: "Meggy" }, { code: 70, name: "Sárga szilva" }, { code: 71, name: "Hazai kék szilva" },
            { code: 72, name: "Japán szilva" }, { code: 80, name: "Fehérszőlő" }, { code: 81, name: "Magnélküli fehérszőlő" },
            { code: 82, name: "Pirosszőlő" }, { code: 84, name: "Kékszőlő" }, { code: 90, name: "Őszibarack" },
            { code: 93, name: "Nektarin" }, { code: 96, name: "Sárgabarack" }, { code: 101, name: "Piros alma Ambrosia" },
            { code: 103, name: "Piros alma Braeburn" }, { code: 106, name: "Evelina alma" }, { code: 107, name: "Piros alma Fuji" },
            { code: 108, name: "Piros alma Gala" }, { code: 110, name: "Piros alma Idared" }, { code: 111, name: "Piros alma Jonagold" },
            { code: 113, name: "Piros alma Pinova" }, { code: 114, name: "Piros alma Red Chief" }, { code: 118, name: "Pirosalma ömlesztett" },
            { code: 122, name: "Gránátalma" }, { code: 130, name: "Zöldalma golden" }, { code: 132, name: "Zöld alma Granny Smith" },
            { code: 133, name: "Zöldalma ömlesztett" }, { code: 142, name: "Körte Conference" }, { code: 148, name: "Nashi körte" },
            { code: 153, name: "Körte Piros" }, { code: 161, name: "Cantaloupedinnye" }, { code: 167, name: "Gáliadinnye" },
            { code: 173, name: "Görögdinnye" }, { code: 174, name: "Magszegény görögdinnye" }, { code: 176, name: "Mini görögdinnye" },
            { code: 180, name: "Bio Banán" }, { code: 184, name: "Bio mangó" }, { code: 3507, name: "Cosmic Crips alma" },
            { code: 4130, name: "Pirosalma Pink Lady" }, { code: 4196, name: "Pirosalma Crimson snow" }
        ];

        let deck = [];
        let currentItem = null;
        let currentMode = 'tanulo';
        let inputText = "";
        let streak = 0;
        let successCount = 0;

        function initMenu() {
            const container = document.getElementById('categories');
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.innerText = `Gyümölcsök (${adatbazis.length} db)`;
            btn.onclick = () => {
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('mode-screen').style.display = 'block';
            };
            container.appendChild(btn);
        }

        function showMenu() {
            document.getElementById('mode-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }

        function startGame(mode) {
            currentMode = mode;
            deck = [...adatbazis].sort(() => Math.random() - 0.5);
            successCount = 0;
            document.getElementById('mode-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            nextProduct();
        }

        function nextProduct() {
            if(deck.length === 0) deck = [...adatbazis].sort(() => Math.random() - 0.5);
            currentItem = deck.pop();
            document.getElementById('product-name').innerText = currentItem.name;
            document.getElementById('counter-display').innerText = `${successCount} / ${adatbazis.length}`;
            resetState();
        }

        function resetState() {
            inputText = "";
            document.getElementById('input-display').innerText = "";
            document.getElementById('plu-hint').innerText = (currentMode === 'tanulo') ? currentItem.code : "";
            document.getElementById('plu-hint').style.backgroundColor = "black";
        }

        function pressNum(val) {
            if (inputText.length < 4) {
                inputText += val;
                document.getElementById('input-display').innerText = inputText;
            }
        }

        function pressC() { inputText = ""; document.getElementById('input-display').innerText = ""; }

        function revealCode() {
            if(currentMode === 'gyakorlo') inputText = currentItem.code.toString();
            document.getElementById('input-display').innerText = inputText;
        }

        function pressPlu() {
            if(parseInt(inputText) === currentItem.code) {
                successCount++;
                nextProduct();
            } else {
                document.getElementById('plu-hint').style.backgroundColor = "red";
                setTimeout(resetState, 1000);
            }
        }

        initMenu();
    </script>
</body>
</html>
