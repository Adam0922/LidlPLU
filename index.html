<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lidl PLU Gyakorló</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --panel: #2a2a3e;
            --surface: #181825;
            --text: #cdd6f4;
            --subtext: #a6adc8;
            --bg-left: #ffffff;
            --bg-right: #f0f2f5;
            --top-bar: #000000;
            --plu-bar: #000000;
            --btn-num: #7abce8;
            --btn-plu: #96b986;
            --btn-ean: #c2d1c2;
            --streak-bg: #4a4a4a;
            --streak-ok: #4caf50;
            --streak-err: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Helvetica', Arial, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── MENÜK ── */
        #menu-screen, #mode-screen, #end-screen {
            text-align: center;
            width: 100%;
            max-width: 680px;
            padding: 24px 20px;
            overflow-y: auto;
            max-height: 100dvh;
        }
        #mode-screen, #end-screen { display: none; }

        h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin-bottom: 6px; }
        .menu-sub { color: var(--subtext); font-size: 1rem; margin-bottom: 28px; }

        /* Csoport fejlécek a főmenüben */
        .group-label {
            text-align: left;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--subtext);
            margin: 20px 0 10px 4px;
        }
        /* Kártya sor */
        .cat-row {
            display: flex;
            gap: 12px;
            margin-bottom: 4px;
        }
        .cat-card {
            flex: 1;
            background-color: var(--panel);
            color: var(--text);
            border: none;
            padding: 18px 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border: 2px solid transparent;
        }
        .cat-card:active { transform: scale(0.96); background-color: var(--surface); }
        .cat-card .cat-icon { font-size: 2rem; }
        .cat-card .cat-name { font-size: 0.9rem; line-height: 1.2; }
        .cat-card .cat-count { font-size: 0.75rem; color: var(--subtext); font-weight: normal; }
        /* Kategória színek */
        .cat-card.gyumolcs { border-color: #a6e3a1; }
        .cat-card.zoldseg  { border-color: #94e2d5; }
        .cat-card.boff-edes { border-color: #fab387; }
        .cat-card.boff-sos  { border-color: #f9e2af; }
        .cat-card.osszes   { border-color: #89b4fa; }

        /* Módválasztó */
        .mode-btn {
            background-color: transparent;
            color: var(--text);
            border: 2px solid var(--panel);
            width: 48%;
            padding: 26px 10px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            margin: 1%;
        }
        .mode-btn:active { transform: scale(0.95); }
        #btn-tanulo { border-color: #cba6f7; color: #cba6f7; }
        #btn-gyakorlo { border-color: #89b4fa; color: #89b4fa; }
        .back-text-btn {
            background: none; border: none; color: var(--subtext);
            font-size: 1.1rem; margin-top: 24px; cursor: pointer; text-decoration: underline;
            display: block;
        }

        /* ── VÉGE KÉPERNYŐ ── */
        .end-emoji { font-size: 5rem; margin-bottom: 10px; }
        .end-title { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: bold; margin-bottom: 8px; }
        .end-subtitle { color: var(--subtext); font-size: 1rem; margin-bottom: 28px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
        .stat-card { background: var(--panel); border-radius: 12px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .stat-icon { font-size: 1.6rem; }
        .stat-value { font-size: 1.4rem; font-weight: bold; }
        .stat-label { font-size: 0.75rem; color: var(--subtext); text-align: center; }
        .end-btn { width: 100%; padding: 16px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; margin-bottom: 12px; transition: 0.2s; }
        .end-btn:active { transform: scale(0.98); }
        .end-btn-primary { background: #89b4fa; color: #1e1e2e; }
        .end-btn-secondary { background: var(--panel); color: var(--text); }

        /* ── KASSZA APP ── */
        #app-screen {
            display: none;
            width: 100%;
            max-width: 1400px;
            height: 100%;
            background-color: var(--bg-left);
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .top-bar {
            background-color: var(--top-bar);
            height: 6dvh; min-height: 40px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: white;
        }
        .top-bar-left { display: flex; align-items: center; gap: 16px; }
        .top-bar .counter { font-size: clamp(1rem, 2.5dvh, 1.4rem); font-weight: bold; }
        .top-bar .timer { font-size: clamp(0.8rem, 2dvh, 1rem); color: #aaa; font-variant-numeric: tabular-nums; }
        .top-bar .cat-tag { font-size: clamp(0.7rem, 1.8dvh, 0.95rem); color: #888; margin-left: 4px; }
        .top-bar .back-btn { background: none; border: none; color: white; font-size: clamp(1rem, 2dvh, 1.1rem); font-weight: bold; cursor: pointer; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .left-pane { flex: 1.3; display: flex; flex-direction: column; position: relative; }
        .unit-badge {
            position: absolute; top: 2vmin; left: 2vmin;
            background: white; border: 2px solid #ccc; border-radius: 8px;
            width: clamp(60px, 10vmin, 90px); height: clamp(60px, 10vmin, 90px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: #333;
        }
        .unit-badge .icon { font-size: clamp(1.5rem, 4vmin, 2.5rem); font-weight: bold; margin-bottom: -5px; }
        .unit-badge .text { font-size: clamp(0.6rem, 1.5vmin, 0.9rem); color: #666; }
        .product-name {
            flex: 1; display: flex; justify-content: center; align-items: center;
            font-size: clamp(1.6rem, 6dvh, 4.5rem); font-weight: bold; color: #333;
            text-align: center; padding: 2vmin 4vmin;
        }
        .plu-bar {
            background-color: var(--plu-bar);
            height: 16dvh; min-height: 80px;
            display: flex; justify-content: center; align-items: center;
            font-size: clamp(3rem, 10dvh, 6rem); font-weight: bold; color: white;
            transition: background-color 0.2s;
        }
        .right-pane { flex: 1; background-color: var(--bg-right); display: flex; flex-direction: column; padding: 2vmin; border-left: 2px solid #ddd; }
        .input-row { display: flex; align-items: center; margin-bottom: 2vmin; }
        .input-display {
            flex: 1; background: white; border-radius: 8px;
            height: 10dvh; min-height: 50px; display: flex; align-items: center; justify-content: flex-end;
            padding: 0 15px; font-size: clamp(2rem, 5dvh, 3.5rem); font-weight: bold; color: #333;
            margin-right: 1.5vmin; border: 2px solid #ddd;
        }
        .streak-container { display: flex; flex-direction: column; gap: 0.5vmin; margin-right: 1.5vmin; }
        .streak-dot {
            width: clamp(20px, 4vmin, 30px); height: clamp(15px, 2.5dvh, 25px);
            background-color: var(--streak-bg); border-radius: 4px; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 0.8rem; font-weight: bold;
        }
        .c-btn {
            width: 10dvh; min-width: 50px; height: 10dvh; min-height: 50px;
            background: white; border: 2px solid #ddd; border-radius: 8px;
            font-size: clamp(1.5rem, 4dvh, 2.5rem); font-weight: bold; color: #333;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .c-btn:active { background: #e0e0e0; }
        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 1.5vmin; flex: 1; }
        .btn { border: none; border-radius: 8px; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: clamp(1.2rem, 4dvh, 2.5rem); cursor: pointer; color: #333; transition: filter 0.1s; }
        .btn:active { filter: brightness(0.85); }
        .btn:disabled { cursor: not-allowed; opacity: 0.8; filter: none; }
        .btn-num { background-color: var(--btn-num); }
        .btn-plu { background-color: var(--btn-plu); grid-row: span 2; }
        .btn-white { background-color: white; color: #aaa; font-size: clamp(0.7rem, 2dvh, 1.2rem); text-align: center; }
        .btn-ean { background-color: var(--btn-ean); color: #889988; font-size: clamp(1rem, 2.5dvh, 1.5rem); }

        /* ── MOBIL LANDSCAPE GOMB ── */
        #mobile-btn {
            display: none;
            position: fixed;
            bottom: 18px; right: 18px;
            z-index: 9999;
            background: var(--panel);
            border: 2px solid #89b4fa;
            color: #89b4fa;
            border-radius: 50px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            align-items: center;
            gap: 7px;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #mobile-btn:active { transform: scale(0.94); }
        #mobile-btn.ls-on { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }

        /* ── LANDSCAPE FORGATÁS ──
           CSS rotate trick: a body fizikailag elfér portrait
           szélesben is, csak 90°-kal elforgatjuk. */
        body.landscape {
            width: 100dvh;
            height: 100dvw;
            transform: rotate(90deg) translateY(-100%);
            transform-origin: top left;
            position: fixed;
            top: 0; left: 0;
            overflow: hidden;
        }

        /* Menük: kisebb padding, max-height igazítva */
        body.landscape #menu-screen,
        body.landscape #mode-screen,
        body.landscape #end-screen {
            padding: 10px 14px;
            max-height: 100dvw;
        }
        body.landscape h1 { font-size: 1.3rem; margin-bottom: 3px; }
        body.landscape .menu-sub { font-size: 0.8rem; margin-bottom: 10px; }
        body.landscape .group-label { margin: 8px 0 5px 2px; font-size: 0.65rem; }
        body.landscape .cat-row { gap: 7px; margin-bottom: 2px; }
        body.landscape .cat-card { padding: 8px 6px; border-radius: 10px; gap: 3px; }
        body.landscape .cat-card .cat-icon { font-size: 1.3rem; }
        body.landscape .cat-card .cat-name { font-size: 0.72rem; }
        body.landscape .cat-card .cat-count { font-size: 0.6rem; }
        body.landscape .mode-btn { padding: 14px 8px; font-size: 1rem; }
        body.landscape .end-emoji { font-size: 2.8rem; margin-bottom: 6px; }
        body.landscape .end-title { font-size: 1.4rem; }
        body.landscape .stat-card { padding: 8px 5px; gap: 3px; }
        body.landscape .stat-icon { font-size: 1.1rem; }
        body.landscape .stat-value { font-size: 1rem; }
        body.landscape .end-btn { padding: 12px; font-size: 0.95rem; margin-bottom: 8px; }

        /* App screen landscape méretezés */
        body.landscape .top-bar { height: 7vw; min-height: 30px; padding: 0 10px; }
        body.landscape .top-bar .counter { font-size: clamp(0.75rem, 2.2vw, 1rem); }
        body.landscape .top-bar .timer   { font-size: clamp(0.65rem, 1.8vw, 0.85rem); }
        body.landscape .top-bar .cat-tag { font-size: clamp(0.6rem, 1.5vw, 0.8rem); }
        body.landscape .unit-badge { width: clamp(40px, 8vmin, 60px); height: clamp(40px, 8vmin, 60px); }
        body.landscape .unit-badge .icon { font-size: clamp(0.9rem, 2.8vmin, 1.6rem); }
        body.landscape .unit-badge .text { font-size: clamp(0.5rem, 1.2vmin, 0.75rem); }
        body.landscape .product-name { font-size: clamp(1.1rem, 4.5vw, 2.8rem); padding: 1vmin 2vmin; }
        body.landscape .plu-bar { height: 20vw; min-height: 54px; font-size: clamp(1.8rem, 7vw, 3.5rem); }
        body.landscape .input-display { height: 11vw; min-height: 38px; font-size: clamp(1.2rem, 3.8vw, 2.2rem); padding: 0 10px; }
        body.landscape .c-btn { width: 11vw; min-width: 38px; height: 11vw; min-height: 38px; font-size: clamp(0.9rem, 3.2vw, 1.6rem); }
        body.landscape .streak-dot { width: clamp(12px, 2.8vmin, 20px); height: clamp(8px, 1.8vw, 15px); font-size: 0.65rem; }
        body.landscape .right-pane { padding: 1.2vmin; }
        body.landscape .input-row { margin-bottom: 1.2vmin; }
        body.landscape .numpad { gap: 1vmin; }
        body.landscape .btn { font-size: clamp(0.85rem, 2.8vw, 1.7rem); border-radius: 6px; }
        body.landscape .btn-white { font-size: clamp(0.5rem, 1.5vw, 0.82rem); }
        body.landscape .btn-ean   { font-size: clamp(0.65rem, 1.8vw, 1rem); }
    </style>
</head>
<body>

<!-- FŐMENÜ -->
<div id="menu-screen">
    <h1>🛒 PLU Gyakorló</h1>
    <p class="menu-sub">Válaszd ki a kategóriát!</p>
    <div id="categories"></div>
</div>

<!-- MOBIL LANDSCAPE GOMB (csak mobilon jelenik meg) -->
<button id="mobile-btn" onclick="toggleLandscape()">
    <span id="mobile-btn-icon">📱→🖥</span>
    <span id="mobile-btn-label">Mobil nézet</span>
</button>

<!-- MÓDVÁLASZTÓ -->
<div id="mode-screen">
    <h1>Mód választása</h1>
    <p class="menu-sub" id="mode-subtitle" style="margin-bottom:28px;"></p>
    <div>
        <button class="mode-btn" id="btn-tanulo" onclick="startGame('tanulo')">📖 Tanuló mód<br><span style="font-size:0.85rem; font-weight:normal;">3 helyes válasz kell</span></button>
        <button class="mode-btn" id="btn-gyakorlo" onclick="startGame('gyakorlo')">🎯 Gyakorló mód<br><span style="font-size:0.85rem; font-weight:normal;">1 helyes válasz, nincs puska</span></button>
    </div>
    <button class="back-text-btn" onclick="showMenu()">← Vissza a kategóriákhoz</button>
</div>

<!-- VÉGE KÉPERNYŐ -->
<div id="end-screen">
    <div class="end-emoji" id="end-emoji">🎉</div>
    <div class="end-title" id="end-title">Gratulálok!</div>
    <div class="end-subtitle" id="end-subtitle"></div>
    <div class="stat-grid" id="stat-grid"></div>
    <button class="end-btn end-btn-primary" onclick="restartGame()">🔄 Újra</button>
    <button class="end-btn end-btn-secondary" onclick="showMenu()">🏠 Főoldal</button>
</div>

<!-- KASSZA APP -->
<div id="app-screen">
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="counter" id="counter-display">0 / 0</div>
            <div class="timer" id="timer-display" style="display:none;">⏱ 0:00</div>
            <div class="cat-tag" id="cat-tag-display"></div>
        </div>
        <button class="back-btn" onclick="showModeScreen()">← Vissza</button>
    </div>
    <div class="main-container">
        <div class="left-pane">
            <div class="unit-badge">
                <div class="icon" id="unit-icon">1</div>
                <div class="text" id="unit-text">Darab</div>
            </div>
            <div class="product-name" id="product-name">Termék Neve</div>
            <div class="plu-bar" id="plu-hint"></div>
        </div>
        <div class="right-pane">
            <div class="input-row">
                <div class="input-display" id="input-display"></div>
                <div class="streak-container">
                    <div class="streak-dot" id="streak-1">1</div>
                    <div class="streak-dot" id="streak-2">2</div>
                    <div class="streak-dot" id="streak-3">3</div>
                </div>
                <button class="c-btn" onclick="pressC()">C</button>
            </div>
            <div class="numpad">
                <button class="btn btn-white" disabled>Sztornó</button>
                <button class="btn btn-white" disabled>Nyugta<br>törlése</button>
                <button class="btn btn-white" disabled>Göngyö-<br>leg</button>
                <button class="btn" style="background:#add8e6;color:#555;font-size:clamp(0.7rem,2dvh,1.2rem);" disabled>Mennyi-<br>ség</button>
                <button class="btn btn-num" onclick="pressNum('7')">7</button>
                <button class="btn btn-num" onclick="pressNum('8')">8</button>
                <button class="btn btn-num" onclick="pressNum('9')">9</button>
                <button class="btn btn-plu" onclick="pressPlu()">PLU</button>
                <button class="btn btn-num" onclick="pressNum('4')">4</button>
                <button class="btn btn-num" onclick="pressNum('5')">5</button>
                <button class="btn btn-num" onclick="pressNum('6')">6</button>
                <button class="btn btn-num" onclick="pressNum('1')">1</button>
                <button class="btn btn-num" onclick="pressNum('2')">2</button>
                <button class="btn btn-num" onclick="pressNum('3')">3</button>
                <button class="btn btn-ean" disabled>EAN</button>
                <button class="btn btn-num" onclick="pressNum('0')">0</button>
                <button class="btn btn-num" onclick="pressNum('00')">00</button>
                <button class="btn btn-num" disabled>,</button>
                <button class="btn btn-white" id="hint-btn" style="color:var(--streak-err);font-size:clamp(1.2rem,3.5dvh,2rem);" onclick="pressHint()">🚨</button>
            </div>
        </div>
    </div>
</div>

function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
}
function hideAll() {
    ['menu-screen','mode-screen','app-screen','end-screen'].forEach(id => {
        const el = document.getElementById(id);
        el.style.display = 'none';
    });
}
function show(id, displayType = 'block') {
    hideAll();
    document.getElementById(id).style.display = displayType;
}

// ═══════════════════════════════════════════
//  MENÜ ÉPÍTÉS
// ═══════════════════════════════════════════
function initMenu() {
    const container = document.getElementById('categories');
    container.innerHTML = '';

    // Sor 1: Gyümölcs + Zöldség
    const row1 = document.createElement('div');
    row1.className = 'cat-row';

    // Sor 2: BOFF Édes + BOFF Sós
    const row2 = document.createElement('div');
    row2.className = 'cat-row';

    // Sor 3: Összes (full width)
    const row3 = document.createElement('div');
    row3.className = 'cat-row';

    KATEGORIAK.forEach((k, i) => {
        const count = adatbazis.filter(k.filter).length;
        const btn = document.createElement('button');
        btn.className = `cat-card ${k.css}`;
        btn.innerHTML = `
            <div class="cat-icon">${k.icon}</div>
            <div class="cat-name">${k.name}</div>
            <div class="cat-count">${count} termék</div>
        `;
        btn.onclick = () => selectCategory(i);

        if (i < 2) row1.appendChild(btn);
        else if (i < 4) row2.appendChild(btn);
        else row3.appendChild(btn);
    });

    const lbl1 = document.createElement('div');
    lbl1.className = 'group-label';
    lbl1.textContent = 'Zöldség-Gyümölcs osztály';

    const lbl2 = document.createElement('div');
    lbl2.className = 'group-label';
    lbl2.textContent = 'BOFF Pékárú osztály';

    const lbl3 = document.createElement('div');
    lbl3.className = 'group-label';
    lbl3.textContent = 'Kombinált';

    container.appendChild(lbl1);
    container.appendChild(row1);
    container.appendChild(lbl2);
    container.appendChild(row2);
    container.appendChild(lbl3);
    container.appendChild(row3);
}

function showMenu() {
    stopTimer();
    show('menu-screen');
}
function showModeScreen() {
    stopTimer();
    show('mode-screen');
}

function selectCategory(index) {
    selectedCatIndex = index;
    const k = KATEGORIAK[index];
    const count = adatbazis.filter(k.filter).length;
    document.getElementById('mode-subtitle').innerText = `${k.icon} ${k.name} — ${count} termék`;
    show('mode-screen');
}

// ═══════════════════════════════════════════
//  IDŐZÍTŐ
// ═══════════════════════════════════════════
function startTimer() {
    startTime = Date.now();
    elapsedSeconds = 0;
    document.getElementById('timer-display').innerText = '⏱ 0:00';
    timerInterval = setInterval(() => {
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer-display').innerText = '⏱ ' + formatTime(elapsedSeconds);
    }, 1000);
}
function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

    stopTimer();
    show('end-screen');

    if (currentMode === 'gyakorlo') {
        document.getElementById('end-emoji').innerText = errorCount === 0 ? '🏆' : (errorCount <= 5 ? '🎉' : '💪');
        document.getElementById('end-title').innerText = errorCount === 0 ? 'Hibátlan! Szuperál!' : 'Gratulálok!';
        document.getElementById('end-subtitle').innerText = 'Sikerült az összes terméket teljesíteni!';
        const grid = document.getElementById('stat-grid');
        grid.style.display = 'grid';
        grid.innerHTML = `
            <div class="stat-card">
                <div class="stat-icon">⏱</div>
                <div class="stat-value">${formatTime(elapsedSeconds)}</div>
                <div class="stat-label">Eltelt idő</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">❌</div>
                <div class="stat-value" style="color:${errorCount===0?'var(--streak-ok)':'var(--streak-err)'}">${errorCount}</div>
                <div class="stat-label">Elrontott válasz</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🚨</div>
                <div class="stat-value" style="color:${hintCount===0?'var(--streak-ok)':'#ffcc00'}">${hintCount}</div>
                <div class="stat-label">Felhasznált puska</div>
            </div>
        `;
    } else {
        document.getElementById('end-emoji').innerText = '🎉';
        document.getElementById('end-title').innerText = 'Gratulálok!';
        document.getElementById('end-subtitle').innerText = 'Sikerült az összes terméket megtanulni!';
        document.getElementById('stat-grid').style.display = 'none';
    }
}

function restartGame() { startGame(currentMode); }

// ═══════════════════════════════════════════
//  JÁTÉK LOGIKA
// ═══════════════════════════════════════════
function startGame(mode) {
    currentMode = mode;
    activeList = adatbazis.filter(KATEGORIAK[selectedCatIndex].filter);
    if (activeList.length === 0) return;

    successCount = 0;
    totalCount   = activeList.length;
    errorCount   = 0;
    hintCount    = 0;
    lastItem     = null;
    gameQueue    = shuffleArray(activeList);

    show('app-screen', 'flex');

    // Felső sáv kategória tag
    document.getElementById('cat-tag-display').innerText =
        KATEGORIAK[selectedCatIndex].icon + ' ' + KATEGORIAK[selectedCatIndex].name;

    const isGyakorlo = currentMode === 'gyakorlo';
    document.getElementById('streak-2').style.visibility = isGyakorlo ? 'hidden' : 'visible';
    document.getElementById('streak-3').style.visibility = isGyakorlo ? 'hidden' : 'visible';
    document.getElementById('hint-btn').disabled     = !isGyakorlo;
    document.getElementById('hint-btn').style.opacity = isGyakorlo ? '1' : '0.4';

    const timerEl = document.getElementById('timer-display');
    if (isGyakorlo) {
        timerEl.style.display = 'block';
        startTimer();
    } else {
        timerEl.style.display = 'none';
        stopTimer();
    }

    nextProduct();
}

function nextProduct() {
    if (gameQueue.length === 0) { showEndScreen(); return; }

    // Tanuló mód: ne jöjjön egymás után ugyanaz
    if (currentMode === 'tanulo' && lastItem && gameQueue.length > 1) {
        if (gameQueue[0].code === lastItem.code) {
            const swapIdx = 1 + Math.floor(Math.random() * (gameQueue.length - 1));
            [gameQueue[0], gameQueue[swapIdx]] = [gameQueue[swapIdx], gameQueue[0]];
        }
    }

    currentItem = gameQueue.shift();
    lastItem = currentItem;

    document.getElementById('counter-display').innerText = `${successCount} / ${totalCount}`;
    document.getElementById('product-name').innerText = currentItem.name;

    if (currentItem.unit === "mérős") {
        document.getElementById('unit-icon').innerText = "⚖";
        document.getElementById('unit-text').innerText = "Mérős";
    } else {
        document.getElementById('unit-icon').innerText = "1";
        document.getElementById('unit-text').innerText = "Darab";
    }
    resetInputState();
}

function resetInputState() {
    streak = 0;
    inputText = "";
    pluVisible = (currentMode === 'tanulo');
    isWaiting = false;
    hintShown = false;

    document.getElementById('input-display').innerText = "";
    const hintBar = document.getElementById('plu-hint');
    hintBar.style.backgroundColor = "var(--plu-bar)";
    hintBar.style.color = "white";
    hintBar.innerText = currentMode === 'tanulo' ? currentItem.code : "";

    ['streak-1','streak-2','streak-3'].forEach(id =>
        document.getElementById(id).style.backgroundColor = "var(--streak-bg)"
    );
}

// ═══════════════════════════════════════════
//  GOMB LOGIKA
// ═══════════════════════════════════════════
function pressNum(val) {
    if (isWaiting) return;
    if (val === "00") { if (inputText.length <= 2) inputText += val; }
    else              { if (inputText.length < 4)  inputText += val; }
    document.getElementById('input-display').innerText = inputText;

    if (pluVisible && currentMode === 'tanulo') {
        document.getElementById('plu-hint').innerText = "";
        pluVisible = false;
    }
    if (hintShown) {
        document.getElementById('plu-hint').innerText = "";
        hintShown = false;
    }
}

function pressC() {
    if (isWaiting) return;
    inputText = "";
    document.getElementById('input-display').innerText = "";
    if (hintShown) {
        document.getElementById('plu-hint').innerText = "";
        hintShown = false;
    }
}

function pressPlu() {
    if (isWaiting || inputText === "") return;
    const numVal = parseInt(inputText, 10);
    const hintBar = document.getElementById('plu-hint');

    if (numVal === currentItem.code) {
        streak++;
        document.getElementById('streak-' + streak).style.backgroundColor = "var(--streak-ok)";
        const roundDone = (currentMode === 'gyakorlo' && streak === 1) || (currentMode === 'tanulo' && streak === 3);

        if (roundDone) {
            successCount++;
            document.getElementById('counter-display').innerText = `${successCount} / ${totalCount}`;
            isWaiting = true;
            hintBar.innerText = currentItem.code;
            hintBar.style.color = "var(--streak-ok)";
            setTimeout(gameQueue.length === 0 ? showEndScreen : nextProduct, gameQueue.length === 0 ? 900 : 1000);
        } else {
            inputText = "";
            document.getElementById('input-display').innerText = "";
        }
    } else {
        isWaiting = true;
        if (currentMode === 'gyakorlo') errorCount++;
        const errorBox = currentMode === 'gyakorlo' ? 1 : streak + 1;
        if (errorBox <= 3) document.getElementById('streak-' + errorBox).style.backgroundColor = "var(--streak-err)";
        if (currentMode === 'gyakorlo') hintBar.style.backgroundColor = "var(--streak-err)";
        setTimeout(resetInputState, 1000);
    }
}

function pressHint() {
    if (isWaiting || currentMode !== 'gyakorlo') return;
    hintCount++;
    const hintBar = document.getElementById('plu-hint');
    hintBar.innerText = currentItem.code;
    hintBar.style.color = "#ffcc00";
    hintShown = true;
}

// ═══════════════════════════════════════════
//  BILLENTYŰZET
// ═══════════════════════════════════════════
document.addEventListener('keydown', e => {
    if (document.getElementById('app-screen').style.display === 'none') return;
    if (e.key >= '0' && e.key <= '9') pressNum(e.key);
    else if (e.key === 'Enter') pressPlu();
    else if (['Backspace','Escape','c','C'].includes(e.key)) pressC();
});

// ═══════════════════════════════════════════
//  MOBIL LANDSCAPE MÓD
// ═══════════════════════════════════════════
let landscapeOn = false;

function isMobileDevice() {
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && window.screen.width <= 1024);
}

function initMobileBtn() {
    const btn = document.getElementById('mobile-btn');
    if (isMobileDevice()) {
        btn.style.display = 'flex';
    }
    // Ha volt mentett állapot (pl. oldal újratölt), visszaállítjuk
    if (localStorage.getItem('plu_landscape') === '1') {
        applyLandscape(true, false);
    }
}

function toggleLandscape() {
    applyLandscape(!landscapeOn, true);
}

function applyLandscape(on, save) {
    landscapeOn = on;
    const btn = document.getElementById('mobile-btn');
    const icon  = document.getElementById('mobile-btn-icon');
    const label = document.getElementById('mobile-btn-label');

    if (on) {
        document.body.classList.add('landscape');
        btn.classList.add('ls-on');
        icon.textContent  = '🖥→📱';
        label.textContent = 'Normál nézet';
    } else {
        document.body.classList.remove('landscape');
        btn.classList.remove('ls-on');
        icon.textContent  = '📱→🖥';
        label.textContent = 'Mobil nézet';
    }
    if (save) {
        try { localStorage.setItem('plu_landscape', on ? '1' : '0'); } catch(e) {}
    }
}

// INDÍTÁS
initMobileBtn();
initMenu();
</script>
