<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lidl PLU Gyakorló</title>
    
    <style>
        /* --- ALAP SZÍNEK ÉS STÍLUSOK --- */
        :root {
            --bg: #1e1e2e;
            --panel: #2a2a3e;
            --surface: #181825;
            --text: #cdd6f4;
            --subtext: #a6adc8;
            --bg-left: #ffffff;
            --bg-right: #f0f2f5;
            --top-bar: #000000;
            --plu-bar: #000000;
            --btn-num: #7abce8;
            --btn-plu: #96b986;
            --btn-ean: #c2d1c2;
            --streak-bg: #4a4a4a;
            --streak-ok: #4caf50;
            --streak-err: #f44336;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Helvetica', Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; 
            width: 100vw;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- FŐMENÜ ÉS MÓDVÁLASZTÓ --- */
        #menu-screen, #mode-screen {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        #mode-screen { display: none; }
        
        h1 { font-size: clamp(2rem, 5vw, 2.5rem); margin-bottom: 10px; }
        p { color: var(--subtext); font-size: 1.2rem; margin-bottom: 40px; }
        
        .cat-btn {
            background-color: var(--panel);
            color: var(--text);
            border: none;
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn:active { background-color: var(--surface); transform: scale(0.98); }
        
        .mode-btn {
            background-color: transparent;
            color: var(--text);
            border: 2px solid var(--panel);
            width: 48%;
            padding: 30px 10px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            margin: 1%;
        }
        .mode-btn:active { transform: scale(0.95); }
        #btn-tanulo { border-color: #cba6f7; color: #cba6f7; }
        #btn-gyakorlo { border-color: #89b4fa; color: #89b4fa; }

        .back-text-btn {
            background: none; border: none; color: var(--subtext);
            font-size: 1.2rem; margin-top: 30px; cursor: pointer; text-decoration: underline;
        }

        /* --- KASSZA MONITOR --- */
        #app-screen {
            display: none;
            width: 100%;
            max-width: 1400px;
            height: 100%;
            background-color: var(--bg-left);
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* FELSŐ SÁV */
        .top-bar {
            background-color: var(--top-bar);
            height: 6dvh;
            min-height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: white;
        }
        .top-bar .counter { font-size: clamp(1rem, 2.5dvh, 1.4rem); font-weight: bold; }
        .top-bar .back-btn {
            background: none; border: none; color: white;
            font-size: clamp(1rem, 2dvh, 1.1rem); font-weight: bold; cursor: pointer;
        }

        /* FŐ TARTALOM */
        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* BAL PANEL */
        .left-pane { flex: 1.3; display: flex; flex-direction: column; position: relative; }
        
        .unit-badge {
            position: absolute; top: 2vmin; left: 2vmin;
            background: white; border: 2px solid #ccc; border-radius: 8px;
            width: clamp(60px, 10vmin, 90px); height: clamp(60px, 10vmin, 90px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #333;
        }
        .unit-badge .icon { font-size: clamp(1.5rem, 4vmin, 2.5rem); font-weight: bold; margin-bottom: -5px; }
        .unit-badge .text { font-size: clamp(0.7rem, 1.5vmin, 1rem); color: #666; }
        
        .product-name {
            flex: 1; display: flex; justify-content: center; align-items: center;
            font-size: clamp(2rem, 7dvh, 5rem); font-weight: bold; color: #333;
            text-align: center; padding: 2vmin 4vmin;
        }
        
        .plu-bar {
            background-color: var(--plu-bar); 
            height: 16dvh; min-height: 80px;
            display: flex; justify-content: center; align-items: center;
            font-size: clamp(3rem, 10dvh, 6rem); font-weight: bold; color: white;
            transition: background-color 0.2s; /* Animáció a piros villanáshoz */
        }

        /* JOBB PANEL */
        .right-pane {
            flex: 1; background-color: var(--bg-right); display: flex;
            flex-direction: column; padding: 2vmin; border-left: 2px solid #ddd;
        }
        
        .input-row { display: flex; align-items: center; margin-bottom: 2vmin; }
        
        .input-display {
            flex: 1; background: white; border-radius: 8px;
            height: 10dvh; min-height: 50px; display: flex; align-items: center; justify-content: flex-end;
            padding: 0 15px; font-size: clamp(2rem, 5dvh, 3.5rem); font-weight: bold; color: #333;
            margin-right: 1.5vmin; border: 2px solid #ddd;
        }
        
        .streak-container { display: flex; flex-direction: column; gap: 0.5vmin; margin-right: 1.5vmin; }
        .streak-dot {
            width: clamp(20px, 4vmin, 30px); height: clamp(15px, 2.5dvh, 25px); 
            background-color: var(--streak-bg); border-radius: 4px; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 0.8rem; font-weight: bold;
        }
        
        .c-btn {
            width: 10dvh; min-width: 50px; height: 10dvh; min-height: 50px; 
            background: white; border: 2px solid #ddd; border-radius: 8px; font-size: clamp(1.5rem, 4dvh, 2.5rem); font-weight: bold; color: #333;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .c-btn:active { background: #e0e0e0; }

        /* NUMPAD */
        .numpad {
            display: grid; grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 1fr; gap: 1.5vmin; flex: 1;
        }
        .btn {
            border: none; border-radius: 8px; font-weight: bold; display: flex; justify-content: center; align-items: center;
            font-size: clamp(1.2rem, 4dvh, 2.5rem); cursor: pointer; color: #333; transition: filter 0.1s;
        }
        .btn:active { filter: brightness(0.85); }
        .btn:disabled { cursor: not-allowed; opacity: 0.8; filter: none; }
        
        .btn-num { background-color: var(--btn-num); }
        .btn-plu { background-color: var(--btn-plu); grid-row: span 2; }
        .btn-white { background-color: white; color: #aaa; font-size: clamp(0.7rem, 2dvh, 1.2rem); text-align: center; }
        .btn-ean { background-color: var(--btn-ean); color: #889988; font-size: clamp(1rem, 2.5dvh, 1.5rem); }
        
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>Lidl PLU Gyakorló</h1>
        <p>Válaszd ki a kategóriát!</p>
        <div id="categories"></div>
    </div>

    <div id="mode-screen">
        <h1>Mód választása</h1>
        <p id="mode-subtitle">X termék kiválasztva</p>
        <div>
            <button class="mode-btn" id="btn-tanulo" onclick="startGame('tanulo')">📖 Tanuló mód<br><span style="font-size:0.9rem; font-weight:normal;">3 helyes válasz kell</span></button>
            <button class="mode-btn" id="btn-gyakorlo" onclick="startGame('gyakorlo')">🎯 Gyakorló mód<br><span style="font-size:0.9rem; font-weight:normal;">1 helyes válasz, nincs puska</span></button>
        </div>
        <button class="back-text-btn" onclick="showMenu()">← Vissza a kategóriákhoz</button>
    </div>

    <div id="app-screen">
        <div class="top-bar">
            <div class="counter" id="counter-display">0 / 0</div>
            <button class="back-btn" onclick="showModeScreen()">← Vissza</button>
        </div>
        
        <div class="main-container">
            <div class="left-pane">
                <div class="unit-badge">
                    <div class="icon" id="unit-icon">1</div>
                    <div class="text" id="unit-text">Darab</div>
                </div>
                <div class="product-name" id="product-name">Termék Neve</div>
                <div class="plu-bar" id="plu-hint">1234</div>
            </div>
            
            <div class="right-pane">
                <div class="input-row">
                    <div class="input-display" id="input-display"></div>
                    <div class="streak-container">
                        <div class="streak-dot" id="streak-1">1</div>
                        <div class="streak-dot" id="streak-2">2</div>
                        <div class="streak-dot" id="streak-3">3</div>
                    </div>
                    <button class="c-btn" onclick="pressC()">C</button>
                </div>
                
                <div class="numpad">
                    <button class="btn btn-white" disabled>Sztornó</button>
                    <button class="btn btn-white" disabled>Nyugta<br>törlése</button>
                    <button class="btn btn-white" disabled>Göngyö-<br>leg</button>
                    <button class="btn" style="background:#add8e6; color:#555; font-size:clamp(0.7rem, 2dvh, 1.2rem);" disabled>Mennyi-<br>ség</button>
                    
                    <button class="btn btn-num" onclick="pressNum('7')">7</button>
                    <button class="btn btn-num" onclick="pressNum('8')">8</button>
                    <button class="btn btn-num" onclick="pressNum('9')">9</button>
                    <button class="btn btn-plu" onclick="pressPlu()">PLU</button>
                    
                    <button class="btn btn-num" onclick="pressNum('4')">4</button>
                    <button class="btn btn-num" onclick="pressNum('5')">5</button>
                    <button class="btn btn-num" onclick="pressNum('6')">6</button>
                    
                    <button class="btn btn-num" onclick="pressNum('1')">1</button>
                    <button class="btn btn-num" onclick="pressNum('2')">2</button>
                    <button class="btn btn-num" onclick="pressNum('3')">3</button>
                    <button class="btn btn-ean" disabled>EAN</button>
                    
                    <button class="btn btn-num" onclick="pressNum('0')">0</button>
                    <button class="btn btn-num" onclick="pressNum('00')">00</button>
                    <button class="btn btn-num" disabled>,</button>
                    <button class="btn btn-white" id="hint-btn" style="color:var(--streak-err); font-size:clamp(1.2rem, 3.5dvh, 2rem);" onclick="pressHint()">🚨</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ADATBÁZIS ---
        const adatbazis = [
            { code: 1, name: "Banán", cat: "Gyümölcs", unit: "mérős" },
            { code: 4, name: "Bandázsolt banán", cat: "Gyümölcs", unit: "mérős" },
            { code: 5, name: "Citrom", cat: "Gyümölcs", unit: "mérős" },
            { code: 6, name: "Lime citrom", cat: "Gyümölcs", unit: "db" },
            { code: 7, name: "Nagyméretű citrom", cat: "Gyümölcs", unit: "mérős" },
            { code: 10, name: "Piros grapefruit", cat: "Gyümölcs", unit: "mérős" },
            { code: 12, name: "Mandarin", cat: "Gyümölcs", unit: "mérős" },
            { code: 20, name: "Narancs", cat: "Gyümölcs", unit: "mérős" },
            { code: 21, name: "Nagyméretű narancs", cat: "Gyümölcs", unit: "mérős" },
            { code: 30, name: "Pomelo", cat: "Gyümölcs", unit: "db" },
            { code: 31, name: "Piros pomelo", cat: "Gyümölcs", unit: "db" },
            { code: 33, name: "Ananász", cat: "Gyümölcs", unit: "db" },
            { code: 34, name: "Avokádó", cat: "Gyümölcs", unit: "db" },
            { code: 35, name: "Friss füge", cat: "Gyümölcs", unit: "db" },
            { code: 37, name: "Datolyaszilva", cat: "Gyümölcs", unit: "db" },
            { code: 40, name: "Kivi", cat: "Gyümölcs", unit: "db" },
            { code: 41, name: "Kiwi Gold", cat: "Gyümölcs", unit: "db" },
            { code: 42, name: "Kókuszdió", cat: "Gyümölcs", unit: "db" },
            { code: 45, name: "Licsi", cat: "Gyümölcs", unit: "mérős" },
            { code: 46, name: "Mangó", cat: "Gyümölcs", unit: "db" },
            { code: 49, name: "Papaja", cat: "Gyümölcs", unit: "db" },
            { code: 52, name: "Fairtrade Maracuja", cat: "Gyümölcs", unit: "db" },
            { code: 54, name: "Gyömbér", cat: "Gyümölcs", unit: "mérős" },
            { code: 61, name: "Cseresznye", cat: "Gyümölcs", unit: "mérős" },
            { code: 62, name: "Meggy", cat: "Gyümölcs", unit: "mérős" },
            { code: 70, name: "Sárga szilva", cat: "Gyümölcs", unit: "mérős" },
            { code: 71, name: "Hazai kék szilva", cat: "Gyümölcs", unit: "mérős" },
            { code: 72, name: "Japán szilva", cat: "Gyümölcs", unit: "mérős" },
            { code: 80, name: "Fehérszőlő", cat: "Gyümölcs", unit: "mérős" },
            { code: 81, name: "Magnélküli fehérszőlő", cat: "Gyümölcs", unit: "mérős" },
            { code: 82, name: "Pirosszőlő", cat: "Gyümölcs", unit: "mérős" },
            { code: 84, name: "Kékszőlő", cat: "Gyümölcs", unit: "mérős" },
            { code: 90, name: "Őszibarack", cat: "Gyümölcs", unit: "mérős" },
            { code: 93, name: "Nektarin", cat: "Gyümölcs", unit: "mérős" },
            { code: 96, name: "Sárgabarack", cat: "Gyümölcs", unit: "mérős" },
            { code: 101, name: "Piros alma Ambrosia", cat: "Gyümölcs", unit: "mérős" },
            { code: 103, name: "Piros alma Braeburn", cat: "Gyümölcs", unit: "mérős" },
            { code: 106, name: "Evelina alma", cat: "Gyümölcs", unit: "mérős" },
            { code: 107, name: "Piros alma Fuji", cat: "Gyümölcs", unit: "mérős" },
            { code: 108, name: "Piros alma Gala", cat: "Gyümölcs", unit: "mérős" },
            { code: 110, name: "Piros alma Idared", cat: "Gyümölcs", unit: "mérős" },
            { code: 111, name: "Piros alma Jonagold", cat: "Gyümölcs", unit: "mérős" },
            { code: 113, name: "Piros alma Pinova", cat: "Gyümölcs", unit: "mérős" },
            { code: 114, name: "Piros alma Red Chief", cat: "Gyümölcs", unit: "mérős" },
            { code: 118, name: "Pirosalma ömlesztett", cat: "Gyümölcs", unit: "mérős" },
            { code: 122, name: "Gránátalma", cat: "Gyümölcs", unit: "db" },
            { code: 130, name: "Zöldalma golden", cat: "Gyümölcs", unit: "mérős" },
            { code: 132, name: "Zöld alma Granny Smith", cat: "Gyümölcs", unit: "mérős" },
            { code: 133, name: "Zöldalma ömlesztett", cat: "Gyümölcs", unit: "mérős" },
            { code: 142, name: "Körte Conference", cat: "Gyümölcs", unit: "mérős" },
            { code: 148, name: "Nashi körte", cat: "Gyümölcs", unit: "db" },
            { code: 153, name: "Körte Piros", cat: "Gyümölcs", unit: "mérős" },
            { code: 161, name: "Cantaloupedinnye", cat: "Gyümölcs", unit: "db" },
            { code: 167, name: "Gáliadinnye", cat: "Gyümölcs", unit: "mérős" },
            { code: 173, name: "Görögdinnye", cat: "Gyümölcs", unit: "mérős" },
            { code: 174, name: "Magszegény görögdinnye", cat: "Gyümölcs", unit: "mérős" },
            { code: 176, name: "Mini görögdinnye", cat: "Gyümölcs", unit: "mérős" },
            { code: 180, name: "Bio Banán", cat: "Gyümölcs", unit: "mérős" },
            { code: 184, name: "Bio mangó", cat: "Gyümölcs", unit: "db" },
            { code: 3507, name: "Cosmic Crips alma", cat: "Gyümölcs", unit: "mérős" },
            { code: 4130, name: "Pirosalma Pink Lady", cat: "Gyümölcs", unit: "mérős" },
            { code: 4196, name: "Pirosalma Crimson snow", cat: "Gyümölcs", unit: "mérős" }
        ];

        const KATEGORIAK = [
            { name: "Gyümölcs 🍎", filter: p => p.cat === "Gyümölcs" },
            { name: "Összes 🛒", filter: p => true }
        ];

        // --- ÁLLAPOTVÁLTOZÓK ---
        let activeList = [];
        let gyakorloQueue = []; // Keverített sor ismétlés nélkül
        let currentItem = null;
        let currentMode = 'tanulo'; // 'tanulo' vagy 'gyakorlo'
        let inputText = "";
        let streak = 0;
        let isWaiting = false;
        let pluVisible = true;
        let successCount = 0;
        let totalCount = 0;
        let hintShown = false; // Puska mutatva van-e

        // --- NAVIGÁCIÓ ---
        function initMenu() {
            const container = document.getElementById('categories');
            container.innerHTML = "";
            KATEGORIAK.forEach((k, index) => {
                const count = adatbazis.filter(k.filter).length;
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.innerHTML = `${k.name} <br><span style="font-size:0.9rem; color:var(--subtext)">${count} termék</span>`;
                btn.onclick = () => selectCategory(index);
                container.appendChild(btn);
            });
        }

        function showMenu() {
            document.getElementById('mode-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }

        let selectedFilterFn = null;
        function selectCategory(index) {
            selectedFilterFn = KATEGORIAK[index].filter;
            const count = adatbazis.filter(selectedFilterFn).length;
            document.getElementById('mode-subtitle').innerText = `${KATEGORIAK[index].name} kategória (${count} termék)`;
            
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('mode-screen').style.display = 'block';
        }

        function showModeScreen() {
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('mode-screen').style.display = 'block';
        }

        // --- JÁTÉK LOGIKA ---
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startGame(mode) {
            currentMode = mode;
            activeList = adatbazis.filter(selectedFilterFn);
            if(activeList.length === 0) return;
            
            successCount = 0;
            totalCount = activeList.length;
            
            if (currentMode === 'gyakorlo') {
                gyakorloQueue = shuffleArray(activeList);
            }
            
            document.getElementById('mode-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            
            // UI igazítása a módhoz
            if(currentMode === 'gyakorlo') {
                document.getElementById('streak-2').style.visibility = 'hidden';
                document.getElementById('streak-3').style.visibility = 'hidden';
                document.getElementById('hint-btn').disabled = false;
                document.getElementById('hint-btn').style.opacity = '1';
            } else {
                document.getElementById('streak-2').style.visibility = 'visible';
                document.getElementById('streak-3').style.visibility = 'visible';
                document.getElementById('hint-btn').disabled = true;
                document.getElementById('hint-btn').style.opacity = '0.4';
            }
            
            nextProduct();
        }

        function nextProduct() {
            if (currentMode === 'gyakorlo') {
                if (gyakorloQueue.length === 0) {
                    // Kör vége, újrakeverés
                    gyakorloQueue = shuffleArray(activeList);
                    successCount = 0;
                    totalCount = activeList.length;
                }
                currentItem = gyakorloQueue.shift();
            } else {
                currentItem = activeList[Math.floor(Math.random() * activeList.length)];
            }
            
            document.getElementById('counter-display').innerText = `${successCount} / ${totalCount}`;
            document.getElementById('product-name').innerText = currentItem.name;
            
            if (currentItem.unit === "mérős") {
                document.getElementById('unit-icon').innerText = "⚖";
                document.getElementById('unit-text').innerText = "Mérős";
            } else {
                document.getElementById('unit-icon').innerText = "1";
                document.getElementById('unit-text').innerText = "Darab";
            }

            resetInputState();
        }

        function resetInputState() {
            streak = 0;
            inputText = "";
            pluVisible = (currentMode === 'tanulo');
            isWaiting = false;
            hintShown = false;
            
            document.getElementById('input-display').innerText = inputText;
            
            const hintBar = document.getElementById('plu-hint');
            hintBar.style.backgroundColor = "var(--plu-bar)";
            hintBar.style.color = "white";
            hintBar.innerText = currentMode === 'tanulo' ? currentItem.code : "";
            
            document.getElementById('streak-1').style.backgroundColor = "var(--streak-bg)";
            document.getElementById('streak-2').style.backgroundColor = "var(--streak-bg)";
            document.getElementById('streak-3').style.backgroundColor = "var(--streak-bg)";
        }

        // --- GOMB LOGIKA ---
        function pressNum(val) {
            if (isWaiting) return;
            
            if (val === "00") {
                if (inputText.length <= 2) inputText += val;
            } else {
                if (inputText.length < 4) inputText += val;
            }
            
            document.getElementById('input-display').innerText = inputText;
            
            // Tanuló módban eltűnik a puska beíráskor
            if (pluVisible && currentMode === 'tanulo') {
                document.getElementById('plu-hint').innerText = "";
                pluVisible = false;
            }
            
            // Ha puska volt mutatva (piros gombbal), töröljük
            if (hintShown) {
                document.getElementById('plu-hint').innerText = "";
                hintShown = false;
            }
        }

        function pressC() {
            if (isWaiting) return;
            inputText = "";
            document.getElementById('input-display').innerText = inputText;
            if (hintShown) {
                document.getElementById('plu-hint').innerText = "";
                hintShown = false;
            }
        }

        function pressPlu() {
            if (isWaiting || inputText === "") return;
            
            const numVal = parseInt(inputText, 10);
            const hintBar = document.getElementById('plu-hint');
            
            if (numVal === currentItem.code) {
                // --- HELYES ---
                streak++;
                document.getElementById('streak-'+streak).style.backgroundColor = "var(--streak-ok)";
                
                // Gyakorló módban 1 találat elég, Tanulóban 3 kell
                if ((currentMode === 'gyakorlo' && streak === 1) || (currentMode === 'tanulo' && streak === 3)) {
                    successCount++;
                    document.getElementById('counter-display').innerText = `${successCount} / ${totalCount}`;
                    
                    isWaiting = true;
                    hintBar.innerText = currentItem.code;
                    hintBar.style.color = "var(--streak-ok)";
                    
                    setTimeout(nextProduct, 1000);
                } else {
                    inputText = "";
                    document.getElementById('input-display').innerText = inputText;
                }
            } else {
                // --- HELYTELEN ---
                isWaiting = true;
                const errorBox = (currentMode === 'gyakorlo') ? 1 : streak + 1;
                
                if(errorBox <= 3) {
                    document.getElementById('streak-'+errorBox).style.backgroundColor = "var(--streak-err)";
                }
                
                // Piros villanás a nagy puskasávon
                if (currentMode === 'gyakorlo') {
                    hintBar.style.backgroundColor = "var(--streak-err)";
                }
                
                setTimeout(() => {
                    resetInputState();
                }, 1000); // 1 másodperc hiba bünti
            }
        }

        function pressHint() {
            if (isWaiting || currentMode !== 'gyakorlo') return;
            const hintBar = document.getElementById('plu-hint');
            hintBar.innerText = currentItem.code;
            hintBar.style.color = "#ffcc00";
            hintShown = true;
        }

        // --- FIZIKAI BILLENTYŰZET TÁMOGATÁS ---
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('app-screen').style.display === 'none') return;
            
            if (e.key >= '0' && e.key <= '9') {
                pressNum(e.key);
            } else if (e.key === 'Enter') {
                pressPlu();
            } else if (e.key === 'Backspace' || e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                pressC();
            }
        });

        // Indítás
        initMenu();
    </script>
</body>
</html>
